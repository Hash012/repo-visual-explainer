<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>代码图谱</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23126c73%27/%3E%3Cpath d=%27M16 5 27 16 16 27 5 16Z%27 fill=%27none%27 stroke=%27white%27 stroke-width=%272%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%273%27 fill=%27white%27/%3E%3C/svg%3E"><link rel="stylesheet" href="/style.css"></head>
<body>
<header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true">◈</span><div><h1 id="atlas-title">代码图谱</h1><p id="atlas-summary">正在连接本地图谱…</p></div></div><div class="header-actions"><span id="revision" class="pill">—</span><button id="undo" disabled>撤销修改</button><button id="export-json" disabled>导出 JSON</button><button id="export-svg" disabled>导出 SVG</button></div></header>
<div id="notice" role="status" aria-live="polite" hidden></div>
<main class="workspace">
<aside class="sidebar"><div class="section-label">探索视角</div><nav id="views" aria-label="图谱视图"></nav><div class="sidebar-help">选择节点或连线查看依据。<br>Ctrl / ⌘ / Shift 点击可多选。<br>拖动空白处平移，滚轮缩放。</div></aside>
<section class="canvas-panel" aria-label="交互图谱"><div class="view-heading"><div><h2 id="view-title">加载中</h2><p id="view-question"></p></div><span id="selection-count" class="pill">未选择</span></div><p id="view-summary" class="view-summary"></p><div class="canvas-wrap" id="canvas-wrap"><svg id="graph" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="可选择的节点与连线"></svg><div id="empty" class="empty" hidden></div><div class="canvas-controls" aria-label="画布控制"><button id="zoom-out" aria-label="缩小">−</button><span id="zoom-label">100%</span><button id="zoom-in" aria-label="放大">＋</button><button id="fit">适应</button><button id="reset">重置</button></div></div><div id="legend" class="legend" aria-label="图例"></div><div id="view-notes" class="view-notes"></div></section>
<aside class="right-panel"><section class="inspector"><div class="section-label">对象详情 <button id="clear-selection" class="quiet">清除选择</button></div><div id="inspector-content"><p class="muted">点击节点或连线，阅读说明与源码依据。</p></div></section><section class="chat"><div class="chat-heading"><h2>与图谱对话</h2><span id="backend" class="pill">本地 · Codex</span></div><div id="messages" class="messages" role="log" aria-label="对话记录" aria-live="polite"></div><form id="ask-form"><fieldset id="modes"><legend class="sr-only">提交模式</legend><label><input type="radio" name="mode" value="qa" checked> 问答</label><label><input type="radio" name="mode" value="edit"> 修改图谱</label></fieldset><p id="mode-hint" class="muted">只解释，不改变图谱。</p><label class="sr-only" for="question">问题或修改要求</label><textarea id="question" rows="3" placeholder="解释选中的关系，或提出图谱修改要求…" required maxlength="12000"></textarea><div class="submit-row"><span id="job-status" role="status">就绪</span><button type="submit" id="submit" disabled>发送 ↗</button></div></form></section></aside>
</main>
<dialog id="source-dialog"><div class="dialog-heading"><h2 id="source-title">源码依据</h2><button id="close-source" aria-label="关闭源码">关闭</button></div><p id="source-claim"></p><pre id="source-text" tabindex="0"></pre></dialog>
<script>window.ATLAS_TOKEN = __ATLAS_TOKEN_JSON__;</script><script src="/app.js" defer></script>
</body></html>
